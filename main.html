<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMDb - Movie Detail Page Redesign</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 600px;
            background: #1f1f1f;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 1. Poster Requirements */
        .moviePic {
            height: 400px;
            width: 280px;
            opacity: 0.95;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s ease, transform 0.3s ease;
            margin-bottom: 30px;
        }

        .moviePic:hover {
            opacity: 1;
            transform: scale(1.02);
        }

        /* 2. Description Requirements */
        .movieDetail {
            position: relative;
            top: 0;
            width: 90%;
            text-align: center;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #b3b3b3;
            margin: 0;
        }

        .movie-title {
            color: #f5c518; /* IMDb Gold */
            font-size: 1.8rem;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="movie-title">Interstellar (2014)</h1>
        
        <!-- Movie Poster -->
        <img class="moviePic" src="https://m.media-amazon.com/images/M/MV5BZjdkOTU3MDktN2IxOS00OGEyLWFmMjktY2FiMmZkNWIyODZiXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_FMjpg_UX1000_.jpg" alt="Interstellar Movie Poster">
        
        <!-- Movie Description -->
        <p class="movieDetail">
            When Earth becomes uninhabitable in the future, a farmer and ex-NASA pilot, Joseph Cooper, is tasked to pilot a spacecraft, along with a team of researchers, to find a new planet for humans.
        </p>
    </div>

</body>
</html>
